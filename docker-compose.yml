services:
  postgres:
    image: postgres:16.6
    container_name: career-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: career_agent
      POSTGRES_PASSWORD: career_agent_password
      POSTGRES_DB: career_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_agent -d career_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: career-agent-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
